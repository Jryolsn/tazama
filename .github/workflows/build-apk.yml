name: Build APK

# Jryolsn fork: builds a sideload APK on every push and publishes it as a GitHub release,
# so Obtainium on the TVs can update the app:
#   dev  -> pre-release  vX.Y.N-dev  (the test TV follows pre-releases)
#   main -> release      vX.Y.N      (the main TV follows releases only)
# Every build is signed with the same sideload key, so updates install over each other.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.9"
  VERSION_BASE: "1.3"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Version
        id: version
        run: |
          suffix=""
          [ "$GITHUB_REF_NAME" = "main" ] || suffix="-dev"
          echo "name=${VERSION_BASE}.${GITHUB_RUN_NUMBER}${suffix}" >> "$GITHUB_OUTPUT"
          # Above the upstream versionCode (4128) that earlier builds carried, so updates are never downgrades.
          echo "code=$((5000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build release APK (no self-updater)
        env:
          SIDELOAD_SIGNING: "true"
        # The run number only grows, so every build is a newer versionCode than the last.
        run: >
          flutter build apk --release --flavor github
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.code }}
      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/*armeabi-v7a*.apk "dist/tazama-${{ steps.version.outputs.name }}-armeabi-v7a.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: tazama
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish release
        if: github.ref_name == 'main' || github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          prerelease=""
          [ "$GITHUB_REF_NAME" = "main" ] || prerelease="--prerelease"
          gh release create "v$VERSION" dist/*.apk $prerelease \
            --target "$GITHUB_SHA" --title "Tazama $VERSION" \
            --notes "$(git log -1 --format=%B "$GITHUB_SHA")"
      - name: Keep only the 10 newest pre-releases
        if: github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease)] | .[10:] | .[].tagName' |
          while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
